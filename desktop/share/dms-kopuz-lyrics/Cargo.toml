[package]
name = "dms-kopuz-lyrics"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"

[dependencies]
utils = { package = "dms-kopuz-lyrics-model", path = "model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "query", "form", "json"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
percent-encoding = "2"
quick-xml = "0.37"
lofty = "0.24"
md5 = "0.8"

[profile.release]
opt-level = 2
