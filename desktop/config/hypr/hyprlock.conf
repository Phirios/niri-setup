general {
    hide_cursor = true
}

background {
    monitor = DP-1
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.55
    contrast = 0.88
    vibrancy = 0.16
}

label {
    monitor = DP-1
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(cad3f5ff)
    font_family = Noto Sans
    font_size = 54
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000088)
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(b8c0e0ff)
    font_family = Noto Sans
    font_size = 18
    position = 0, 250
    halign = center
    valign = center
}

# Glass panel behind the avatar, name, and password field.
shape {
    monitor = DP-1
    size = 430, 340
    color = rgba(181926b8)
    rounding = 24
    border_size = 1
    border_color = rgba(cad3f55c)
    shadow_passes = 3
    shadow_size = 16
    shadow_color = rgba(8aadf466)
    position = 0, -10
    halign = center
    valign = center
    zindex = 0
}

image {
    monitor = DP-1
    path = /home/phirios/Pictures/profile.png
    size = 112
    rounding = -1
    border_size = 2
    border_color = rgba(c6a0f6ff)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000099)
    position = 0, 95
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor = DP-1
    text = Piroz Kiraz
    color = rgba(cad3f5ff)
    font_family = Noto Sans
    font_size = 23
    position = 0, -10
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor = DP-1
    size = 320, 54
    rounding = 18
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.28
    dots_center = true
    outer_color = rgba(8aadf4cc)
    inner_color = rgba(24273add)
    font_color = rgba(cad3f5ff)
    font_family = Noto Sans
    fade_on_empty = false
    placeholder_text = <span foreground="##a5adcb">Password</span>
    hide_input = false
    check_color = rgba(a6da95ff)
    fail_color = rgba(ed8796ff)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000066)
    position = 0, -105
    halign = center
    valign = center
    zindex = 1
}

# Show the current media title when an MPRIS player is available.
label {
    monitor = DP-1
    text = cmd[update:3000] /home/phirios/.local/bin/hyprlock-now-playing
    color = rgba(cad3f5dd)
    font_family = Noto Sans
    font_size = 16
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(000000aa)
    position = 0, -285
    halign = center
    valign = center
}
